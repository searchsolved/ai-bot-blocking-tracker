name: Daily robots.txt audit

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let a manual run and the schedule collide on the same git push.
concurrency:
  group: daily-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}
      CHECKER_URL: ${{ secrets.CHECKER_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit every vertical
        run: |
          today=$(date -u +%F)
          for f in verticals/*.txt; do
            v=$(basename "$f" .txt)
            mkdir -p "data/$v"
            echo "::group::$v"
            python3 audit_robots.py "$f" --out "data/$v/$today.json"
            echo "::endgroup::"
          done

      - name: Refresh Domain Rating (skips if under 28 days old)
        if: ${{ env.AHREFS_API_KEY != '' }}
        run: python3 fetch_dr.py

      - name: Pull checker suggestions into the review queue
        if: ${{ env.CHECKER_URL != '' }}
        run: curl -sf "$CHECKER_URL/suggestions?min=25" -o data/suggestions.json || true

      - name: Build pages
        run: python3 build_page.py

      - name: Commit snapshots and pages
        run: |
          git config user.name "audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Daily audit $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push
